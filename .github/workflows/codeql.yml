# SPDX-License-Identifier: GPL-3.0-or-later
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  c-cpp:
    name: Analyze C/C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp

  swift:
    name: Analyze Swift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install xcodegen cmake pkgconf libplist openssl@3
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Build MirrorAct for analysis
        run: scripts/build.sh --no-install ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
        env:
          MIRRORACT_DERIVED: ${{ runner.temp }}/MirrorActDerivedData
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
